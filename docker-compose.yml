version: '3.8'
services:
  
  # 1. Mesin Laravel (PHP)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeverse-app
    container_name: codeverse-app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - ./:/var/www
    networks:
      - codeverse-network
    depends_on:
      - db

  # 2. Mesin Web Server (Nginx)
  webserver:
    image: nginx:alpine
    container_name: codeverse-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    networks:
      - codeverse-network
    depends_on:
      - app

  # 3. Mesin Database (MySQL - Pengganti XAMPP)
  db:
    image: mysql:8.0
    container_name: codeverse-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-lms_codeverse}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-rahasia123}
      MYSQL_PASSWORD: ${DB_PASSWORD:-rahasia123}
      MYSQL_USER: ${DB_USERNAME:-root}
    volumes:
      - codeverse-db-data:/var/lib/mysql
    networks:
      - codeverse-network

networks:
  codeverse-network:
    driver: bridge

volumes:
  codeverse-db-data: